version: "3"

# Quality gate for Let's Event.
#
# `task quality` runs every check that works without a database:
# dependency check -> typecheck -> lint -> unit tests -> production build.
# E2E is opt-in (`task test:e2e`): it runs in the Playwright Docker image
# against the compose Postgres, so only Docker is needed on the host.
# Tasks shell out to npm scripts so CI, hooks, and the gate stay in sync.

tasks:
  default:
    desc: List available tasks
    cmds:
      - task --list
    silent: true

  setup:
    desc: Install dependencies (npm ci)
    cmds:
      - npm ci

  deps:
    desc: Check that dependencies are installed
    internal: true
    preconditions:
      - sh: test -d node_modules
        msg: "node_modules is missing - run 'task setup' first"

  typecheck:
    desc: Generate Next.js types, then type-check with tsc
    deps: [deps]
    cmds:
      - npx next typegen
      - npm run typecheck

  lint:
    desc: Check code with Biome
    deps: [deps]
    cmds:
      - npm run lint

  format:
    desc: Format code with Biome (write mode, not part of the gate)
    deps: [deps]
    cmds:
      - npm run format

  test:unit:
    desc: Run unit tests (Vitest)
    deps: [deps]
    cmds:
      - npm run test:unit

  test:e2e:
    desc: "Run E2E tests in the Playwright Docker image (extra args after --, e.g. task test:e2e -- --project=chromium)"
    cmds:
      - task: test:e2e:run
        vars: { ARGS: "{{.CLI_ARGS}}" }

  test:e2e:report:
    desc: Open the last Playwright HTML report
    cmds:
      - npx playwright show-report

  # Runs as root inside the container, so generated files are handed back to
  # the host user at the end (the exit status of the tests is preserved).
  test:e2e:run:
    internal: true
    cmds:
      - >-
        docker compose --profile e2e run --rm letsevent-e2e
        sh -c 'npm ci --no-audit --no-fund && npx prisma migrate deploy && npx playwright test {{.ARGS}};
        status=$?; chown -R '"$(id -u):$(id -g)"' test-results playwright-report next-env.d.ts 2>/dev/null; exit $status'

  db:up:
    desc: Start Postgres and wait until it is healthy
    cmd: docker compose up -d

  db:down:
    desc: Stops Postgres and tear it down
    cmd: docker compose down -v --remove-orphans

  build:
    desc: Production build (next build)
    deps: [deps]
    cmds:
      - export RESEND_APIKEY="any-api-key-for-dev" && npm run build

  quality:
    desc: Run the full quality gate (typecheck, lint, unit tests, build)
    deps: [deps]
    cmds:
      - task: typecheck
      - task: lint
      - task: test:unit
      - task: build
