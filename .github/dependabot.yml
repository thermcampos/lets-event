version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    versioning-strategy: increase
    groups:
      react:
        patterns:
          - react
          - react-dom
          - "@types/react"
          - "@types/react-dom"
      prisma:
        patterns:
          - "@prisma/*"
          - prisma
      next:
        patterns:
          - next
          - next-auth
      tailwind:
        patterns:
          - tailwindcss
          - "@tailwindcss/*"
          - tw-animate-css
      testing:
        patterns:
          - "@playwright/test"
          - "@testing-library/*"
          - vitest
          - happy-dom
          - jsdom
    labels:
      - dependencies
      - npm

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    labels:
      - dependencies
      - ci

  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: monthly
    labels:
      - dependencies
      - docker
